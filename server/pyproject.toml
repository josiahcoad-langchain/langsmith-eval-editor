[project]
name = "eval-editor-server"
version = "0.1.0"
description = "Runs the eval editor's tests against your agent, with mocked tools and an LLM judge."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "langsmith>=0.4",
    "langchain>=1.0",
    "langchain-anthropic>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
